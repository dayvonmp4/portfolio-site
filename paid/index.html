<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment received — Devon Reyes Web Design</title>
  <meta name="robots" content="noindex">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at 50% -10%, #1d1530 0%, #111116 55%);
      background-color: #111116;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .check {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #16291c;
      border: 1px solid #2c5237;
      color: #4ade80;
      font-size: 30px;
      line-height: 62px;
      margin: 0 auto 26px;
    }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
    p  { color: #888; font-size: 15px; line-height: 1.7; max-width: 420px; margin: 0 auto; }
    a  { color: #9E7AFF; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    .brand { margin-top: 36px; font-size: 12px; color: #5a5a64; }
  </style>
</head>
<body>
  <main>
    <div class="check">✓</div>
    <h1>Thank you! I'll be getting to work :)</h1>
    <p>Your payment went through and a receipt is on its way to your email. I'll be in touch shortly with next steps. Questions any time: <a href="mailto:devon@reyeswebdesign.com">devon@reyeswebdesign.com</a></p>
    <p class="brand">Devon Reyes Web Design · Cypress, CA</p>
  </main>
</body>
</html>
